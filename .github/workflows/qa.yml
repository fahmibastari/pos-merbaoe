name: QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: merbaoe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d merbaoe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/merbaoe_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/merbaoe_test
      JWT_SECRET: qa-only-secret-with-at-least-thirty-two-characters
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare test database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Unit and integration tests
        run: npm run test:all

      - name: Production build
        run: npm run build

      - name: Browser E2E
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
